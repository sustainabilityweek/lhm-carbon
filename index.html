<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mon Empreinte Carbone — Sustainability Week HOLCIM 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g9:#0a2e1a;--g8:#0D1F3C;--g7:#1e7a46;--g6:#28a05e;--g5:#42c47a;--g4:#72d49a;--g2:#c2f0d5;--g1:#eafaf2;
  --hblue:#0D1F3C;--hblue2:#1B75BC;--hblue3:#6AB023;
  --sand:#f7f4ee;--sand2:#ede8df;--sand3:#ddd6c9;
  --text:#1a1a18;--muted:#6b6b65;--light:#9e9e96;
  --white:#ffffff;
  --r:14px;--rsm:9px;
  --shadow:0 2px 12px rgba(0,0,0,0.07);
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--sand);color:var(--text);min-height:100vh;overflow-x:hidden}

#splash{position:fixed;inset:0;background:#0D1F3C;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
.splash-holcim-logo{margin-bottom:28px;display:flex;align-items:center;justify-content:center}
.splash-leaf{font-size:64px;margin-bottom:20px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#splash h1{font-family:'DM Serif Display',serif;font-size:clamp(26px,5vw,40px);color:#fff;line-height:1.25;margin-bottom:14px}
#splash h1 em{font-style:italic;color:var(--g4)}
#splash p{font-size:14px;color:rgba(255,255,255,.7);max-width:380px;line-height:1.7;margin-bottom:28px}
.splash-tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:36px}
.splash-tag{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:5px 14px;font-size:12px;color:rgba(255,255,255,.9);font-weight:500}
.btn-start{background:var(--g5);color:var(--g9);border:none;border-radius:var(--r);padding:16px 40px;font-size:16px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:transform .15s,background .2s}
.btn-start:hover{background:#5cd68a;transform:scale(1.02)}
.splash-note{font-size:11px;color:rgba(255,255,255,.4);margin-top:14px}

#app{max-width:620px;margin:0 auto;padding:0 16px 100px;display:none}

.topbar{background:#0D1F3C;border-radius:0 0 24px 24px;margin:0 -16px 22px;padding:18px 22px 22px;position:relative;overflow:hidden}
.topbar::after{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:rgba(66,196,122,.1);border-radius:50%;pointer-events:none}
.topbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.topbar-brand{display:flex;align-items:center;gap:10px}
.topbar-logo{display:flex;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:4px 8px;line-height:0}
.topbar-week{font-size:11px;color:var(--g4);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.topbar-score{text-align:right}
.topbar-score-val{font-family:'DM Serif Display',serif;font-size:26px;color:#fff;line-height:1}
.topbar-score-lbl{font-size:10px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.06em}
.prog-bar{height:5px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--g5);border-radius:3px;transition:width .4s ease}
.prog-meta{display:flex;justify-content:space-between;margin-top:6px}
.prog-cat{font-size:12px;color:var(--g4);font-weight:600}
.prog-count{font-size:12px;color:rgba(255,255,255,.4)}

.cat-nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px;scrollbar-width:none}
.cat-nav::-webkit-scrollbar{display:none}
.cat-pill{background:var(--white);border:1.5px solid var(--sand3);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;color:var(--muted);cursor:default;white-space:nowrap;font-family:'DM Sans',sans-serif}
.cat-pill.done{background:var(--g1);border-color:var(--g4);color:var(--g7)}
.cat-pill.active{background:var(--g8);border-color:var(--g8);color:#fff}

.q-card{background:var(--white);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);animation:slideIn .3s ease both}
@keyframes slideIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
.q-tag{display:inline-flex;align-items:center;gap:6px;background:var(--g1);color:var(--g7);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:4px 10px;border-radius:6px;margin-bottom:10px}
.q-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--text);line-height:1.3;margin-bottom:6px}
.q-sub{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:16px}

.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.choice{display:flex;align-items:center;gap:14px;background:var(--sand);border:2px solid transparent;border-radius:var(--rsm);padding:13px 15px;cursor:pointer;transition:all .18s;font-family:'DM Sans',sans-serif;text-align:left}
.choice:hover{border-color:var(--g4);background:var(--g1)}
.choice.on{border-color:var(--g6);background:var(--g1)}
.c-ico{font-size:22px;width:30px;text-align:center;flex-shrink:0}
.c-body{flex:1}
.c-label{font-size:14px;font-weight:500;color:var(--text)}
.c-hint{font-size:12px;color:var(--muted);margin-top:2px}
.c-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--sand3);flex-shrink:0;transition:all .18s;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:transparent}
.choice.on .c-check{background:var(--g6);border-color:var(--g6);color:#fff}

.choices-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:18px}
.gchoice{background:var(--sand);border:2px solid transparent;border-radius:var(--rsm);padding:14px 10px;cursor:pointer;text-align:center;transition:all .18s;font-family:'DM Sans',sans-serif}
.gchoice:hover{border-color:var(--g4);background:var(--g1)}
.gchoice.on{border-color:var(--g6);background:var(--g1)}
.g-ico{font-size:28px;display:block;margin-bottom:6px}
.g-lbl{font-size:12px;font-weight:600;color:var(--text);line-height:1.3}
.g-hint{font-size:11px;color:var(--muted);margin-top:3px}

.slider-section{margin-bottom:18px}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.slider-lbl{font-size:13px;font-weight:500;color:var(--muted)}
.slider-display{font-family:'DM Serif Display',serif;font-size:30px;color:var(--g7)}
.slider-unit-lbl{font-size:14px;color:var(--muted);margin-left:5px}
input[type=range]{width:100%;-webkit-appearance:none;height:8px;border-radius:4px;background:var(--sand2);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--g7);box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer}
.slider-marks{display:flex;justify-content:space-between;margin-top:7px}
.slider-mark{font-size:11px;color:var(--light)}

.num-wrap{display:flex;align-items:center;gap:0;margin-bottom:18px;width:180px}
.num-btn{width:46px;height:46px;border:1.5px solid var(--sand3);background:var(--white);font-size:22px;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--text);transition:background .15s}
.num-btn:first-child{border-radius:var(--rsm) 0 0 var(--rsm)}
.num-btn:last-child{border-radius:0 var(--rsm) var(--rsm) 0}
.num-btn:hover{background:var(--sand)}
.num-val{flex:1;height:46px;border:1.5px solid var(--sand3);border-left:none;border-right:none;text-align:center;font-family:'DM Serif Display',serif;font-size:24px;color:var(--g7);background:var(--white);outline:none}

.infobox{background:var(--g1);border-left:3px solid var(--g5);border-radius:var(--rsm);padding:12px 14px;margin-bottom:16px;font-size:13px;color:var(--g8);line-height:1.55}

.q-nav{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center}
.btn-next{flex:1;padding:15px;background:#0D1F3C;color:#fff;border:none;border-radius:var(--rsm);font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .2s,transform .1s}
.btn-next:hover{background:#1B75BC}
.btn-next:active{transform:scale(.98)}
.btn-prev{padding:15px 20px;background:var(--white);color:var(--muted);border:1.5px solid var(--sand3);border-radius:var(--rsm);font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .15s}
.btn-prev:hover{background:var(--sand)}

/* RESULTS */
.results{animation:slideIn .4s ease both}
.res-hero{background:#0D1F3C;border-radius:var(--r);padding:30px 22px;text-align:center;color:#fff;margin-bottom:14px;position:relative;overflow:hidden}
.res-hero::before{content:'';position:absolute;top:-80px;left:-80px;width:280px;height:280px;background:rgba(66,196,122,.1);border-radius:50%;pointer-events:none}
.res-label{font-size:12px;color:var(--g4);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:10px}
.res-big{font-family:'DM Serif Display',serif;font-size:76px;color:#fff;line-height:1}
.res-unit{font-size:16px;color:rgba(255,255,255,.6);margin-top:4px}
.res-compare{display:flex;gap:8px;margin-top:18px;justify-content:center;flex-wrap:wrap}
.res-cmp{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:5px 14px;font-size:12px;color:rgba(255,255,255,.85)}
.res-zone{display:inline-block;padding:8px 24px;border-radius:20px;font-size:14px;font-weight:700;margin-top:14px}

.gauge-card{background:var(--white);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.gauge-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--light);margin-bottom:14px}
.gauge-track{height:20px;border-radius:10px;background:linear-gradient(90deg,#27ae60 0%,#f9c74f 35%,#f3722c 65%,#c0392b 100%);position:relative;margin-bottom:8px}
.gauge-needle{position:absolute;top:-7px;width:6px;height:34px;background:var(--text);border-radius:3px;transform:translateX(-50%);box-shadow:0 2px 8px rgba(0,0,0,.25);transition:left 1.2s cubic-bezier(.34,1.4,.64,1)}
.gauge-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:14px}
.gauge-refs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gauge-ref{background:var(--sand);border-radius:var(--rsm);padding:10px 12px;text-align:center}
.gauge-ref-val{font-family:'DM Serif Display',serif;font-size:20px;color:var(--text)}
.gauge-ref-lbl{font-size:11px;color:var(--muted);margin-top:2px}

.breakdown-card{background:var(--white);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.bd-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--light);margin-bottom:16px}
.bk-item{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bk-item:last-child{margin-bottom:0}
.bk-ico{font-size:18px;width:26px;text-align:center;flex-shrink:0}
.bk-name{font-size:13px;font-weight:500;color:var(--text);width:96px;flex-shrink:0}
.bk-track{flex:1;height:10px;background:var(--sand);border-radius:5px;overflow:hidden}
.bk-fill{height:100%;border-radius:5px;transition:width .9s cubic-bezier(.4,0,.2,1)}
.bk-num{font-size:12px;font-weight:600;color:var(--muted);width:54px;text-align:right;flex-shrink:0}
.bk-pct{font-size:11px;color:var(--light);width:30px;text-align:right;flex-shrink:0}

.dir-card{background:var(--white);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.dir-hd{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--sand2)}
.dir-hd-ico{font-size:30px}
.dir-hd h2{font-family:'DM Serif Display',serif;font-size:20px;color:var(--text)}
.dir-hd p{font-size:13px;color:var(--muted)}
.dir-item{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid var(--sand2)}
.dir-item:last-of-type{border-bottom:none;padding-bottom:0}
.dir-ico-box{width:44px;height:44px;border-radius:12px;background:var(--g1);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.dir-body{flex:1}
.dir-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:5px;display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap}
.dir-badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:4px}
.dir-badge.high{background:#fee2e2;color:#b91c1c}
.dir-badge.med{background:#fef9c3;color:#854d0e}
.dir-desc{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:6px}
.dir-impact{display:inline-flex;align-items:center;background:var(--g1);color:var(--g7);font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px}

.pledge{background:linear-gradient(135deg,var(--g1),#b8ecd0);border:1.5px solid var(--g2);border-radius:var(--r);padding:22px;text-align:center;margin-bottom:14px}
.pledge-icons{font-size:28px;margin-bottom:10px;letter-spacing:6px}
.pledge h3{font-family:'DM Serif Display',serif;font-size:18px;color:var(--g8);margin-bottom:8px}
.pledge p{font-size:13px;color:var(--g8);line-height:1.6;opacity:.85}

.btn-restart{width:100%;padding:14px;background:var(--sand);color:var(--muted);border:1.5px solid var(--sand3);border-radius:var(--rsm);font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .15s;margin-bottom:8px}
.btn-restart:hover{background:var(--sand2)}
.btn-skip{padding:15px 14px;background:var(--white);color:var(--light);border:1.5px solid var(--sand3);border-radius:var(--rsm);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .15s;white-space:nowrap}
.btn-skip:hover{background:var(--sand);color:var(--muted)}
</style>
</head>

// ══ CALC ══
function calc(){
  let T=0,B={transport:0,logement:0,alimentation:0,conso:0,dechets:0,travail:0};

  // Transport
  const kmDay=(A.t_km||20);
  const teleFact={0:1,1:0.8,2:0.6,3:0.4,4:0.1}[A.t_tele||'0']||1;
  const vehFact={petite:0.17,berline:0.21,suv:0.28,elec:0.04,hybride:0.10,moto_s:0.07,moto_g:0.14};
  const modeFact={voiture:vehFact[A.t_veh]||0.21,covoit:(vehFact[A.t_veh]||0.21)/Math.max(1,A.t_pax||2),moto:vehFact[A.t_veh]||0.10,bus:0.089,tramway:0.006,velo:0,marche:0,tele:0};
  B.transport += (modeFact[A.t_mode]||0)*kmDay*teleFact*250/365;
  const volKm={court:1000,moyen:3500,long:9000,mixte:3500};
  B.transport += ((volKm[A.t_vol_type]||2000)*(A.t_vols||0)*0.255)/365;
  B.transport += ((A.t_train||0)*0.007)/365;

  // Logement
  const occ=Math.max(1,A.l_occ||3),surf=A.l_surf||80;
  const spRatio=surf/occ/28;
  const chFact={butane:5.4,gaz:4.2,elec:1.9,bois:2.9,pac:0.8,aucun:0.1};
  const clFact={intense:2.2,modere:1.1,peu:0.4,non:0.05};
  const eauFact={gaz:1.5,elec:1.2,solaire:0.3,pac:0.5};
  const isolFact={bien:0.72,moyen:1.0,peu:1.38};
  const solFact={pv:0.78,therm:0.92,both:0.62,non:1.0};
  let L=((chFact[A.l_chauf]||2.5)+(clFact[A.l_clim]||0.6)+(eauFact[A.l_eau]||1.1));
  L*=(isolFact[A.l_isol]||1.0)*(solFact[A.l_solaire]||1.0)*spRatio;
  B.logement=Math.max(0.4,L);

  // Alimentation
  const regFact={vegan:1.5,vege:2.5,pesc:3.4,flexi:4.2,omni:5.7,carni:7.9};
  const locFact={max:0.80,fort:0.90,moyen:1.0,peu:1.12};
  const gasFact={peu:0.94,moyen:1.10,fort:1.22,max:1.38};
  const eauFoodCO2={robinet:0.01,petite:0.18,bidon:0.05,fontaine:0.02};
  const cafeFact={the:0.05,cafe_mod:0.10,cafe_fort:0.20,mixte:0.14};
  B.alimentation=(regFact[A.al_regime]||4.5)*(locFact[A.al_local]||1.0)*(gasFact[A.al_gaspi]||1.0)+(eauFoodCO2[A.al_eau]||0.05)+(cafeFact[A.al_cafe]||0.08);

  // Conso
  const veteCO2={tres_peu:0.25,peu:0.75,moyen:1.45,fort:2.6};
  const elecCO2={repare:0.08,un:0.28,deux:0.58,fort:1.15};
  const dataCO2={petit:0.08,moyen:0.18,grand:0.32,illimite:0.48};
  B.conso=(veteCO2[A.co_vete]||0.75)+(elecCO2[A.co_elec]||0.38)+(A.co_stream||2)*0.036+(A.co_mails||30)*0.004+(dataCO2[A.co_data]||0.18);

  // Déchets & activités
  const triCO2={complet:0.18,partiel:0.52,non:1.08};
  const compCO2={maison:-0.14,lhm:-0.10,non:0};
  const plastCO2={zero:-0.12,peu:0,moyen:0.16,fort:0.38};
  const repCO2={toujours:-0.18,souvent:-0.05,rarement:0.18,jamais:0.38};
  const sportCO2={marche:0,velo:0,salle:0.28,golf:0.82,natation:0.45,indoor:0.18};
  const vacCO2={maroc:0.08,maghreb:0.18,europe:0.48,lointain:1.2,home:0};
  B.dechets=Math.max(0.05,(triCO2[A.de_tri]||0.5)+(compCO2[A.de_comp]||0)+(plastCO2[A.de_plast]||0.1)+(repCO2[A.de_repar]||0.1)+(sportCO2[A.ac_sport]||0.1)+(vacCO2[A.ac_vacances]||0.3));

  // TRAVAIL AU BUREAU
  const impCO2={zero:0.01,peu:0.06,moyen:0.16,fort:0.35};
  const ecranCO2={toujours:0.02,souvent:0.08,parfois:0.18,rarement:0.30};
  const veilleCO2={eteint:0.01,veille:0.12,allume:0.25};
  const mailsCO2={regulier:0.02,parfois:0.08,jamais:0.18};
  B.travail=((impCO2[A.w_impression]||0.08)+(ecranCO2[A.w_ecran]||0.12)+(veilleCO2[A.w_veille]||0.12)+(mailsCO2[A.w_mails]||0.08));

  T=B.transport+B.logement+B.alimentation+B.conso+B.dechets+B.travail;
  return{total:Math.round(T*100)/100,breakdown:B};
}

  if(A.de_comp==='non')
    d.push({i:'🌱',t:'Compostez au bureau LHM dès demain',desc:'Bacs à compost disponibles dans les cuisines de chaque site LHM. Vos épluchures, marc de café et sachets de thé deviennent de l\'engrais pour les espaces verts. Formation express de 10 min sur le portail Développement Durable.',impact:'↓ 0.15 kg CO₂/jour',p:'med'});
  d.push({i:'🌳',t:'LHM Planète — parrainez un arbre',desc:'Programme de reforestation LHM dans le Rif et le Moyen-Atlas avec des associations locales. Chaque collaborateur peut parrainer 1 arbre (50 DH). 1 arbre = ~22 kg CO₂ absorbés/an. Formulaire sur l\'intranet LHM, onglet "Développement Durable".',impact:'🌲 22 kg CO₂ compensés/an',p:'med'});
  return d;
}

// ══ RENDER ══
let qi=0;
const vqs=()=>QS.filter(q=>!q.skip||!q.skip(A));
const curQ=()=>vqs()[qi];

function startApp(){
  document.getElementById('splash').classList.add('out');
  document.getElementById('app').style.display='block';
  renderQ();
}

function updateTopbar(){
  const r=calc();
  document.getElementById('liveScore').textContent=r.total.toFixed(1);
  const q=curQ();
  const pct=Math.round(qi/vqs().length*100);
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progCat').textContent=CATS.find(c=>c.id===(q?.cat||''))?.lbl||'';
  document.getElementById('progCount').textContent=(qi+1)+' / '+vqs().length;
  // cat nav
  const nav=document.getElementById('catNav');
  nav.innerHTML=CATS.map(c=>{
    const qs=vqs().filter(q=>q.cat===c.id);
    const answered=qs.filter(q=>A[q.key]!==null&&A[q.key]!==undefined).length;
    const cls=c.id===(q?.cat||'')?'active':answered>0&&answered===qs.length?'done':'';
    return `<div class="cat-pill ${cls}">${c.lbl}</div>`;
  }).join('');
}

function renderQ(){
  if(qi>=vqs().length){renderResults();return;}
  const q=curQ();
  updateTopbar();
  const catLbl=CATS.find(c=>c.id===q.cat)?.lbl||'';
  let body='';

  if(q.type==='choice'){
    body=`<div class="choices">${q.opts.map(o=>`
      <div class="choice ${A[q.key]===o.v?'on':''}" onclick="pick('${q.key}','${o.v}')">
        <span class="c-ico">${o.i}</span>
        <div class="c-body"><div class="c-label">${o.l}</div>${o.h?`<div class="c-hint">${o.h}</div>`:''}</div>
        <div class="c-check">✓</div>
      </div>`).join('')}</div>`;
  } else if(q.type==='grid'){
    body=`<div class="choices-grid">${q.opts.map(o=>`
      <div class="gchoice ${A[q.key]===o.v?'on':''}" onclick="pick('${q.key}','${o.v}')">
        <span class="g-ico">${o.i}</span>
        <div class="g-lbl">${o.l}</div>
        ${o.h?`<div class="g-hint">${o.h}</div>`:''}
      </div>`).join('')}</div>`;
  } else if(q.type==='slider'){
    const v=A[q.key]??q.min;
    body=`<div class="slider-section">
      <div class="slider-top">
        <span class="slider-lbl">${q.unit}</span>
        <div><span class="slider-display" id="sv">${v}</span><span class="slider-unit-lbl"> ${q.unit}</span></div>
      </div>
      <input type="range" min="${q.min}" max="${q.max}" step="${q.step}" value="${v}"
        oninput="A['${q.key}']=+this.value;document.getElementById('sv').textContent=this.value;updateTopbar()">
      <div class="slider-marks">${(q.marks||[]).map(m=>`<span class="slider-mark">${m}</span>`).join('')}</div>
    </div>`;
  } else if(q.type==='num'){
    const v=A[q.key]??q.min??0;
    body=`<div class="num-wrap">
      <button class="num-btn" onclick="numChg('${q.key}',${q.min||0},${q.max||99},-1)">−</button>
      <input class="num-val" id="nv_${q.key}" value="${v}" readonly>
      <button class="num-btn" onclick="numChg('${q.key}',${q.min||0},${q.max||99},1)">+</button>
    </div>`;
  }

  const info=q.info?`<div class="infobox">ℹ️ ${q.info}</div>`:'';
  const prev=qi>0?`<button class="btn-prev" onclick="goBack()">← Retour</button>`:'';
  const nxt=qi===vqs().length-1?'Voir mon bilan 🌿':'Valider →';

  document.getElementById('qArea').innerHTML=`
  <div class="q-card">
    <div class="q-tag">${catLbl}</div>
    <div class="q-title">${q.title}</div>
    ${q.sub?`<div class="q-sub">${q.sub}</div>`:''}
    ${info}${body}
    <div class="q-nav">
      ${prev}
      <button class="btn-skip" onclick="skip()">Je ne peux pas répondre</button>
      <button class="btn-next" onclick="goNext()">${nxt}</button>
    </div>
  </div>`;
}

function pick(key,val){
  A[key]=val;
  updateTopbar();
  const area=document.getElementById('qArea');
  if(area){
    area.querySelectorAll('.choice, .gchoice').forEach(el=>el.classList.remove('on'));
    const sel=area.querySelector(`[onclick*="'${val}'"]`);
    if(sel)sel.classList.add('on');
  }
}
function numChg(key,min,max,d){
  A[key]=Math.min(max,Math.max(min,(A[key]??min)+d));
  const el=document.getElementById('nv_'+key);
  if(el)el.value=A[key];
  updateTopbar();
}
function goNext(){qi=Math.min(qi+1,vqs().length);renderQ();window.scrollTo({top:0,behavior:'smooth'});}
function goBack(){qi=Math.max(0,qi-1);renderQ();window.scrollTo({top:0,behavior:'smooth'});}
function skip(){const q=curQ();if(q)A[q.key]=null;goNext();}

// ══ RESULTS ══
function renderResults(){
  const res=calc(),{total,breakdown:b}=res;
  const zone=total<6?{l:'🌿 Excellent',c:'#14532d',bg:'#dcfce7'}
    :total<12?{l:'🟡 Acceptable',c:'#713f12',bg:'#fef9c3'}
    :total<20?{l:'🟠 Impact élevé',c:'#7c2d12',bg:'#ffedd5'}
    :{l:'🔴 Impact critique',c:'#7f1d1d',bg:'#fee2e2'};
  const ptr=Math.min(Math.max(total<6?total/6*25:total<12?25+(total-6)/6*25:total<20?50+(total-12)/8*25:75+Math.min((total-20)/10*25,22),2),96);
  const marRef=14.2,wRef=12.0;
  const vsM=Math.round((total/marRef-1)*100);
  const vsW=Math.round((total/wRef-1)*100);
  const cats=[
    {l:'Transport',    v:b.transport,    c:'#3b82f6',e:'🚗'},
    {l:'Logement',     v:b.logement,     c:'#f59e0b',e:'🏠'},
    {l:'Alimentation', v:b.alimentation, c:'#10b981',e:'🥗'},
    {l:'Consommation', v:b.conso,        c:'#8b5cf6',e:'🛍'},
    {l:'Déchets',      v:b.dechets,      c:'#06b6d4',e:'♻️'},
    {l:'Au bureau',    v:b.travail,      c:'#e11d48',e:'🏢'},
  ];
  const maxV=Math.max(...cats.map(c=>c.v));

  document.getElementById('progFill').style.width='100%';
  document.getElementById('progCat').textContent='🌍 Résultats';
  document.getElementById('progCount').textContent='Complet ✓';
  document.getElementById('catNav').innerHTML=CATS.map(c=>`<div class="cat-pill ${c.id==='resultats'?'active':'done'}">${c.lbl}</div>`).join('');

  document.getElementById('qArea').innerHTML=`
  <div class="results">
    <div class="res-hero">
      <div class="res-label">Votre empreinte carbone journalière</div>
      <div class="res-big">${total.toFixed(1)}</div>
      <div class="res-unit">kg CO₂ équivalent / jour</div>
      <div class="res-compare">
        <div class="res-cmp">${vsM>=0?'+':''}${vsM}% vs moy. Maroc (${marRef} kg/j)</div>
        <div class="res-cmp">${vsW>=0?'+':''}${vsW}% vs moy. mondiale</div>
        <div class="res-cmp">${Math.round(total*365)} kg CO₂/an</div>
      </div>
      <div class="res-zone" style="background:${zone.bg};color:${zone.c}">${zone.l}</div>
    </div>

    <div class="gauge-card">
      <div class="gauge-title">Niveau d'impact climatique</div>
      <div class="gauge-track"><div class="gauge-needle" style="left:${ptr}%"></div></div>
      <div class="gauge-row">
        <span>🌿 Excellent (&lt;6)</span><span>🟡 Acceptable (&lt;12)</span><span>🟠 Élevé (&lt;20)</span><span>🔴 Critique</span>
      </div>
      <div class="gauge-refs">
        <div class="gauge-ref"><div class="gauge-ref-val">${marRef}</div><div class="gauge-ref-lbl">Moy. Maroc (kg/j)</div></div>
        <div class="gauge-ref"><div class="gauge-ref-val">${wRef}</div><div class="gauge-ref-lbl">Moy. mondiale (kg/j)</div></div>
        <div class="gauge-ref"><div class="gauge-ref-val">6.8</div><div class="gauge-ref-lbl">Objectif 2050 (kg/j)</div></div>
        <div class="gauge-ref"><div class="gauge-ref-val">${Math.round(total*365)}</div><div class="gauge-ref-lbl">Votre total annuel (kg)</div></div>
      </div>
    </div>

    <div class="breakdown-card">
      <div class="bd-title">Détail par catégorie</div>
      ${cats.map(c=>`<div class="bk-item">
        <span class="bk-ico">${c.e}</span>
        <span class="bk-name">${c.l}</span>
        <div class="bk-track"><div class="bk-fill" style="width:${Math.round(c.v/maxV*100)}%;background:${c.c}"></div></div>
        <span class="bk-num">${c.v.toFixed(2)} kg</span>
        <span class="bk-pct">${Math.round(c.v/total*100)}%</span>
      </div>`).join('')}
    </div>

    <button class="btn-restart" onclick="restart()">↺ Recommencer le calcul</button>
  </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

function restart(){
  qi=0;
  Object.keys(A).forEach(k=>A[k]=typeof A[k]==='number'?(['t_km','l_surf','l_occ','co_stream','co_mails'].includes(k)?{t_km:20,l_surf:80,l_occ:3,co_stream:2,co_mails:30}[k]:0):null);
  A.t_km=20;A.l_surf=80;A.l_occ=3;A.co_stream=2;A.co_mails=30;
  A.w_impression=null;A.w_ecran=null;A.w_veille=null;A.w_mails=null;
  renderQ();window.scrollTo({top:0,behavior:'smooth'});
}
</script>
